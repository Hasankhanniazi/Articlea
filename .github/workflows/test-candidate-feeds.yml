name: Test candidate publisher feeds
# Temporary feed diagnostics; remove after this one-off run.
on:
  push:
    paths:
      - ".github/workflows/test-candidate-feeds.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/test-candidate-feeds.mjs
