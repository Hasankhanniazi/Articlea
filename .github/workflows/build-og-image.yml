name: Build social preview image
on:
  push:
    paths:
      - "assets/og-image.svg"
      - ".github/workflows/build-og-image.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Render 1200x630 PNG
        run: rsvg-convert --width 1200 --height 630 assets/og-image.svg --output assets/og-image.png
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-image.png
          git diff --cached --quiet || git commit -m "Generate Articlea social preview PNG"
          git push
